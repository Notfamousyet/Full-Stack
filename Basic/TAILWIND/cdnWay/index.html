<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
  </head>
  <body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <form class="bg-gray-800 rounded-lg p-8 shadow-lg max-w-sm w-full">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-300 mb-2" for="">Email</label>
          <input class="w-full px-3 py-2 bg-gray-600 border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500" type="email" name="" placeholder="Email" id="">
        </div>
        <div class="mb-7">
          <label class="block text-sm font-medium text-gray-300 mb-2"  for="">Password</label>
          <input class="w-full px-3 py-2 bg-gray-600 border-gray-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500"  type="password" name="" placeholder="password" id="">
        </div>
        <button class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 mb-5" type="submit">Login</button>
        <div class="m-4 grid grid-cols-1 gap-4 sm:grid-cols-12">
          <div class="min-h-20 rounded-lg bg-orange-400 flex justify-center items-center sm:col-span-4 sm:block hidden">
            
          </div>
          <div class="min-h-20 rounded-lg bg-teal-200 flex justify-center items-center sm:col-span-8">
            
          </div>
        </div>
    </form>
  </body>
</html>
