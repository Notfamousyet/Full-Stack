<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Master Class</title>
    <link rel="stylesheet" href="gridM.css">
</head>
<body>
    <h1>CSS Grid Masterclass Demo</h1>
    <div class="container">
        <h2>1. Basic Grid (3X3)</h2>
        <div class="grid-container" id="container1">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </div>
    <div class="container">
        <h2>2. Grid with different column sizes</h2>
        <div class="grid-container" id="container2">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </div>
    <div class="container">
        <h2>3. Grid with Gaps</h2>
        <div class="grid-container" id="container3">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </div>
    <div class="container">
        <h2>4. Grid item Placement</h2>
        <div class="grid-container" id="container4">
            <div class="box" id="box41">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box" id="box45">5</div>

        </div>
    </div>
    <div class="container">
        <h2>5. Grid template Areas</h2>
        <div class="grid-container" id="container5">
            <div class="box" id="Headers">Headers</div>
            <div class="box" id="Slidebar">Slidebar</div>
            <div class="box" id="MainC">Main Content</div>
            <div class="box" id="Footer">Footer</div>
        </div>
    </div>
    <div class="container">
        <h2>6. Auto-Fit and Minmax</h2>
        <div class="grid-container" id="container6">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
        </div>
    </div>
        

</body>
</html>
