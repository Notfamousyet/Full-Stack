<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="card">
        <form>
        <input type="email" name="Email" class="idpass" placeholder="Email">
        <div class="naming">
            <input type="text" name="Name" id="fname" placeholder="First name">
            <input type="text" name="Last name" id="lname" placeholder="Last name">
        </div>
        <input type="password" name="Password" class="idpass" placeholder="Password">
        <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
